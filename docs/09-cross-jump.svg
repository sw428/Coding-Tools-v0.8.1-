<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="09｜HTML ⇄ CSS の相互ジャンプ"><rect width="1080" height="470" rx="18" fill="#fff"/><rect x="10" y="10" width="1060" height="450" rx="18" fill="none" stroke="#d2dae8"/><style>
text{font-family:"Yu Gothic", "Noto Sans CJK JP", Arial,sans-serif;fill:#1c2d47} .head{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#5a687e}.box{fill:#f7faff;stroke:#c8d5e8;stroke-width:2}.hi{fill:#e7f1ff;stroke:#4079d5;stroke-width:2}.tag{fill:#2353a2}.tagtext{fill:#fff;font-weight:700;font-size:17px}.code{font-family:Consolas,monospace;font-size:18px}.label{font-size:20px;font-weight:700}.note{font-size:15px;fill:#56657a}.arrow{fill:none;stroke:#4778c8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 9;animation:move 1.5s linear infinite}.pulse{animation:pulse 4.2s ease-in-out infinite}.step2{animation:fade2 4.2s ease-in-out infinite}.step3{animation:fade3 4.2s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-44}}@keyframes pulse{0%,26%,100%{opacity:.4}10%,23%{opacity:1}}@keyframes fade2{0%,26%,55%,100%{opacity:.5}33%,52%{opacity:1}}@keyframes fade3{0%,56%,100%{opacity:.5}66%,94%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.step2,.step3,.arrow{animation:none!important;opacity:1!important}}</style><text x="44" y="57" class="head">09｜HTML ⇄ CSS の相互ジャンプ</text><text x="44" y="88" class="sub">前後のクラス移動と組み合わせる。確認画面なし。複数候補はエディタでTab切替。</text><g class="pulse"><rect class="box" x="45" y="140" width="306" height="216" rx="13"/><text x="66" y="176" class="label">HTML側</text><text x="65" y="228" class="code">class=&quot;card&quot;</text><rect x="152" y="208" width="66" height="27" rx="4" fill="#b3dcff" opacity=".48"/><text class="note" x="66" y="301">クラス全体を選択</text><text class="tagtext" x="65" y="333"> </text></g>
<path class="arrow" d="M357 245 H423"/><g class="step2"><rect class="hi" x="435" y="140" width="205" height="216" rx="13"/><text x="455" y="176" class="label">ジャンプ</text><text x="452" y="223" class="note">Ctrl+Alt+3 → CSS</text><text x="452" y="258" class="note">Ctrl+Alt+4 → HTML</text><text x="452" y="303" class="note">一致1件：即ジャンプ</text><text x="452" y="333" class="note">複数：Tabで次へ</text></g>
<path class="arrow" d="M647 245 H712"/><g class="step3"><rect class="box" x="725" y="140" width="312" height="216" rx="13"/><text x="744" y="176" class="label">CSS側</text><text x="742" y="228" class="code">.card { ... }</text><text class="note" x="746" y="301">Shift+Tabで前へ</text><text class="note" x="746" y="329">Escで切替を終了</text></g><text x="44" y="438" class="note">候補巡回時だけTabを使用。Escで解除すると通常のTabに戻ります。コードは書き換えません。</text></svg>