<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="396" viewBox="0 0 1080 396" role="img" aria-label="04_CSSにクラスを追加"><title>04_CSSにクラスを追加</title><style xmlns="http://www.w3.org/2000/svg">
    text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#18304a}
    .heading{font-size:36px;font-weight:700}.lead{font-size:22px}.title{font-size:26px;font-weight:700}
    .body{font-size:21px}.small{font-size:18px;fill:#4b6278}.key{font-family:Consolas,"Yu Gothic",monospace;font-size:21px;font-weight:700;fill:#184f9c}
    .code{font-family:Consolas,monospace;font-size:24px;fill:#e4efff}.num{font-size:22px;font-weight:700;fill:white}
    .card{fill:white;stroke:#d2deeb;stroke-width:1.5}.keybox{fill:#eaf2ff;stroke:#c5d9f6}.codebox{fill:#18304a}
    .arrow{stroke:#2877bb;stroke-width:3;fill:none;marker-end:url(#tip)}
  </style><defs xmlns="http://www.w3.org/2000/svg"><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2877bb" /></marker></defs><rect width="1080" height="396" fill="#f2f6fb"/><text x="48" y="37" class="small">Coding Tools ｜ Windowsの初期キー ／ ＋は同時押し</text><g transform="translate(48 62)" xmlns="http://www.w3.org/2000/svg"><rect class="card" width="984" height="302" rx="16" /><circle cx="34" cy="36" r="19" fill="#2475b8" /><text x="27" y="44" class="num">4</text><text x="66" y="45" class="title">HTMLのクラス名をコピーして、CSSに追加する</text><text x="24" y="83" class="body">HTMLの card の中にカーソルを置いて、下の順に操作します。</text><rect x="24" y="103" width="430" height="57" rx="9" class="keybox" /><text x="42" y="139" class="key">Ctrl + Alt + Shift + C</text><text x="487" y="139" class="body">クラス名 card をコピー</text><path d="M239 169V184" class="arrow" /><rect x="24" y="194" width="430" height="57" rx="9" class="keybox" /><text x="42" y="230" class="key">Ctrl + Alt + P</text><text x="487" y="220" class="body">CSSの追加先と変更内容を確認して、</text><text x="487" y="249" class="body">空の .card { } を追加する。</text><text x="24" y="281" class="small">すでに .card があれば、そこへ移動。色や余白などの中身は自分で書きます。</text></g></svg>