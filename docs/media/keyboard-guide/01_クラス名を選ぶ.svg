<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="313" viewBox="0 0 1080 313" role="img" aria-label="01_クラス名を選ぶ"><title>01_クラス名を選ぶ</title><style xmlns="http://www.w3.org/2000/svg">
    text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#18304a}
    .heading{font-size:36px;font-weight:700}.lead{font-size:22px}.title{font-size:26px;font-weight:700}
    .body{font-size:21px}.small{font-size:18px;fill:#4b6278}.key{font-family:Consolas,"Yu Gothic",monospace;font-size:21px;font-weight:700;fill:#184f9c}
    .code{font-family:Consolas,monospace;font-size:24px;fill:#e4efff}.num{font-size:22px;font-weight:700;fill:white}
    .card{fill:white;stroke:#d2deeb;stroke-width:1.5}.keybox{fill:#eaf2ff;stroke:#c5d9f6}.codebox{fill:#18304a}
    .arrow{stroke:#2877bb;stroke-width:3;fill:none;marker-end:url(#tip)}
  </style><defs xmlns="http://www.w3.org/2000/svg"><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2877bb" /></marker></defs><rect width="1080" height="313" fill="#f2f6fb"/><text x="48" y="37" class="small">Coding Tools ｜ Windowsの初期キー ／ ＋は同時押し</text><g transform="translate(48 62)" xmlns="http://www.w3.org/2000/svg"><rect class="card" width="984" height="219" rx="16" /><circle cx="34" cy="36" r="19" fill="#2475b8" /><text x="27" y="44" class="num">1</text><text x="66" y="45" class="title">クラス名を、次々に選ぶ</text><rect x="24" y="67" width="430" height="57" rx="9" class="keybox" /><text x="42" y="102" class="key">Ctrl + Alt + J</text><text x="281" y="102" class="body">次へ</text><rect x="24" y="135" width="430" height="57" rx="9" class="keybox" /><text x="42" y="170" class="key">Ctrl + Alt + K</text><text x="281" y="170" class="body">前へ</text><rect x="482" y="67" width="478" height="74" rx="9" class="codebox" /><text x="501" y="113" class="code">class="card card__title"</text><text x="487" y="170" class="body">card → card__title のように選択。</text><text x="487" y="197" class="small">Shiftも一緒に押すと、選択を追加できます。</text></g></svg>