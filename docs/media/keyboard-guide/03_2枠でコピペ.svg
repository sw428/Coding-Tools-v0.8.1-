<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="346" viewBox="0 0 1080 346" role="img" aria-label="03_2枠でコピペ"><title>03_2枠でコピペ</title><style xmlns="http://www.w3.org/2000/svg">
    text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#18304a}
    .heading{font-size:36px;font-weight:700}.lead{font-size:22px}.title{font-size:26px;font-weight:700}
    .body{font-size:21px}.small{font-size:18px;fill:#4b6278}.key{font-family:Consolas,"Yu Gothic",monospace;font-size:21px;font-weight:700;fill:#184f9c}
    .code{font-family:Consolas,monospace;font-size:24px;fill:#e4efff}.num{font-size:22px;font-weight:700;fill:white}
    .card{fill:white;stroke:#d2deeb;stroke-width:1.5}.keybox{fill:#eaf2ff;stroke:#c5d9f6}.codebox{fill:#18304a}
    .arrow{stroke:#2877bb;stroke-width:3;fill:none;marker-end:url(#tip)}
  </style><defs xmlns="http://www.w3.org/2000/svg"><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2877bb" /></marker></defs><rect width="1080" height="346" fill="#f2f6fb"/><text x="48" y="37" class="small">Coding Tools ｜ Windowsの初期キー ／ ＋は同時押し</text><g transform="translate(48 62)" xmlns="http://www.w3.org/2000/svg"><rect class="card" width="984" height="252" rx="16" /><circle cx="34" cy="36" r="19" fill="#2475b8" /><text x="27" y="44" class="num">3</text><text x="66" y="45" class="title">2つの文章やコードを、別々に覚えてコピペする</text><text x="24" y="81" class="body">コピーしたい部分を選択 → 保存。貼りたい場所へ移動 → 貼り付け。</text><rect x="24" y="101" width="454" height="121" rx="9" class="keybox" /><text x="42" y="132" class="body" font-weight="700">保存枠1　例：見出しの文章</text><text x="42" y="169" class="key">Ctrl + Alt + Shift + 1</text><text x="347" y="169" class="small">保存</text><text x="42" y="204" class="key">Ctrl + Alt + 1</text><text x="347" y="204" class="small">貼り付け</text><rect x="506" y="101" width="454" height="121" rx="9" class="keybox" /><text x="524" y="132" class="body" font-weight="700">保存枠2　例：説明の文章</text><text x="524" y="169" class="key">Ctrl + Alt + Shift + 2</text><text x="829" y="169" class="small">保存</text><text x="524" y="204" class="key">Ctrl + Alt + 2</text><text x="829" y="204" class="small">貼り付け</text></g></svg>