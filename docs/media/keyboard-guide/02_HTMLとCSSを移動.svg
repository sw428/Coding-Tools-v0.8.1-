<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="338" viewBox="0 0 1080 338" role="img" aria-label="02_HTMLとCSSを移動"><title>02_HTMLとCSSを移動</title><style xmlns="http://www.w3.org/2000/svg">
    text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#18304a}
    .heading{font-size:36px;font-weight:700}.lead{font-size:22px}.title{font-size:26px;font-weight:700}
    .body{font-size:21px}.small{font-size:18px;fill:#4b6278}.key{font-family:Consolas,"Yu Gothic",monospace;font-size:21px;font-weight:700;fill:#184f9c}
    .code{font-family:Consolas,monospace;font-size:24px;fill:#e4efff}.num{font-size:22px;font-weight:700;fill:white}
    .card{fill:white;stroke:#d2deeb;stroke-width:1.5}.keybox{fill:#eaf2ff;stroke:#c5d9f6}.codebox{fill:#18304a}
    .arrow{stroke:#2877bb;stroke-width:3;fill:none;marker-end:url(#tip)}
  </style><defs xmlns="http://www.w3.org/2000/svg"><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2877bb" /></marker></defs><rect width="1080" height="338" fill="#f2f6fb"/><text x="48" y="37" class="small">Coding Tools ｜ Windowsの初期キー ／ ＋は同時押し</text><g transform="translate(48 62)" xmlns="http://www.w3.org/2000/svg"><rect class="card" width="984" height="244" rx="16" /><circle cx="34" cy="36" r="19" fill="#2475b8" /><text x="27" y="44" class="num">2</text><text x="66" y="45" class="title">HTMLとCSSの、同じクラスへ移動する</text><text x="24" y="82" class="body">まず、移動したいクラス名全体を選択します。</text><rect x="24" y="101" width="430" height="95" rx="9" class="keybox" /><text x="42" y="137" class="key">Ctrl + Alt + 3</text><text x="281" y="137" class="body">CSSへ</text><text x="42" y="176" class="key">Ctrl + Alt + 4</text><text x="281" y="176" class="body">HTMLへ</text><rect x="482" y="101" width="478" height="95" rx="9" class="codebox" /><text x="501" y="137" class="code">class="card"</text><text x="501" y="177" class="code">     ⇅     .card { … }</text><text x="24" y="226" class="small">候補が複数あるとき：Tabで次へ ／ Shift + Tabで前へ ／ Escで切り替え終了</text></g></svg>