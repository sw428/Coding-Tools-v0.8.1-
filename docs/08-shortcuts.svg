<text x="46" y="59" class="t">08｜VS Codeのショートカット一覧で管理</text><text x="46" y="86" class="hint">各コマンドは標準のキーボードショートカットUIに表示。変更はVS Code自身が保存。</text><rect x="47" y="113" width="292" height="219" rx="12" class="base" /><rect x="400" y="113" width="258" height="219" rx="12" class="base" /><rect x="725" y="113" width="260" height="219" rx="12" class="base" /><text x="66" y="145" class="boxTitle">HTML / CSS</text><text x="74" y="184" class="code">class=&quot;card&quot;</text><text x="74" y="223" class="small">選択してコピー3</text><text x="432" y="145" class="boxTitle">独立した2枠</text><rect x="426" y="158" width="202" height="31" rx="7" class="base" /><text x="445" y="180" class="small">1  （保存済み）</text><rect x="426" y="195" width="202" height="31" rx="7" class="base" /><text x="445" y="217" class="small">2  （保存済み）</text><rect x="426" y="232" width="202" height="31" rx="7" class="hi ph3" /><text x="445" y="254" class="small">2  card</text><rect x="426" y="269" width="202" height="31" rx="7" class="base" /><text x="445" y="291" class="small">(旧枠は廃止)</text><text x="746" y="145" class="boxTitle">貼り付け先</text><text x="755" y="194" class="code">CSS: .card</text><text x="755" y="244" class="code">HTML: card</text><path d="M344 215 L393 215" class="flow"/><path d="M661 215 L718 215" class="flow"/><g class="fade1"><circle cx="80" cy="357" r="13" fill="#3D69D5"/><text x="76" y="362" class="num">1</text><text x="99" y="362" class="label">コピー 2</text></g><g class="fade2"><circle cx="347" cy="357" r="13" fill="#3D69D5"/><text x="343" y="362" class="num">2</text><text x="366" y="362" class="label">枠2に記憶</text></g><g class="fade3"><circle cx="603" cy="357" r="13" fill="#3D69D5"/><text x="599" y="362" class="num">3</text><text x="622" y="362" class="label">貼り付け 2</text></g><rect x="50" y="115" width="310" height="195" rx="12" class="base" /><rect x="410" y="115" width="195" height="195" rx="12" class="base" /><rect x="650" y="115" width="332" height="195" rx="12" class="base" /><text x="73" y="149" class="boxTitle">クラス名をコピー</text><text x="85" y="201" class="code">class=&quot;card&quot;</text><text x="435" y="149" class="boxTitle">内部の判定</text><text x="436" y="193" class="small">クラス名: card</text><text x="436" y="234" class="small">ドットを管理</text><text x="680" y="149" class="boxTitle">貼り付け先で分岐</text><rect x="679" y="163" width="276" height="56" rx="6" class="hi ph2" /><text x="696" y="197" class="small">CSSセレクタ → .card</text><rect x="679" y="235" width="276" height="56" rx="6" class="hi ph3" /><text x="696" y="269" class="small">検索 / HTML → card</text><path d="M363 215 L402 215" class="flow"/><path d="M610 215 L642 215" class="flow"/><g class="fade1"><circle cx="80" cy="357" r="13" fill="#3D69D5"/><text x="76" y="362" class="num">1</text><text x="99" y="362" class="label">選択してコピー</text></g><g class="fade2"><circle cx="366" cy="357" r="13" fill="#3D69D5"/><text x="362" y="362" class="num">2</text><text x="385" y="362" class="label">CSSなら「.」付き</text></g><g class="fade3"><circle cx="729" cy="357" r="13" fill="#3D69D5"/><text x="725" y="362" class="num">3</text><text x="748" y="362" class="label">検索は「.」なし</text></g><rect x="49" y="110" width="423" height="226" rx="12" class="base" /><rect x="521" y="110" width="464" height="226" rx="12" class="base" /><text x="75" y="146" class="boxTitle">元のCSS</text><text x="78" y="182" class="code">.course { ... }</text><text x="78" y="218" class="code">.course__title { ... }</text><text x="78" y="285" class="code">.course__link { ... }</text><rect x="69" y="237" width="357" height="33" rx="6" class="hi ph2" /><text x="84" y="261" class="code">+ .course__text { }</text><text x="549" y="146" class="boxTitle">挿入先の判定</text><rect x="542" y="169" width="423" height="39" rx="6" class="base" /><text x="559" y="194" class="small">1  同名ルールがある？ → 既存へ移動</text><rect x="542" y="213" width="423" height="39" rx="6" class="base" /><text x="559" y="238" class="small">2  親・兄弟・状態の位置を確認</text><rect x="542" y="257" width="423" height="56" rx="6" class="hi ph3" /><text x="559" y="281" class="small">3  @media等は条件を分けて判断</text><text x="559" y="303" class="hint">   曖昧なら候補を表示</text><g class="fade1"><circle cx="79" cy="361" r="13" fill="#3D69D5"/><text x="75" y="366" class="num">1</text><text x="98" y="366" class="label">セレクタ取得</text></g><g class="fade2"><circle cx="348" cy="361" r="13" fill="#3D69D5"/><text x="344" y="366" class="num">2</text><text x="367" y="366" class="label">位置を探す</text></g><g class="fade3"><circle cx="630" cy="361" r="13" fill="#3D69D5"/><text x="626" y="366" class="num">3</text><text x="649" y="366" class="label">条件を判定</text></g><rect x="48" y="110" width="555" height="237" rx="12" class="base" /><rect x="657" y="110" width="322" height="237" rx="12" class="base" /><text x="70" y="147" class="boxTitle">挿入先の確認</text><rect x="69" y="165" width="512" height="43" rx="7" class="base" /><text x="90" y="193" class="code">○</text><text x="141" y="193" class="small">既存の .card に移動</text><rect x="69" y="216" width="512" height="43" rx="7" class="hi ph2" /><text x="90" y="244" class="code">◉</text><text x="141" y="244" class="small">既存 @media に追加</text><rect x="69" y="267" width="512" height="43" rx="7" class="base" /><text x="90" y="295" class="code">○</text><text x="141" y="295" class="small">新しい @media を作成</text><text x="680" y="148" class="boxTitle">キー操作</text><text x="684" y="180" class="small">↑ ↓  候補を移動</text><text x="684" y="213" class="small">→     この候補をON</text><text x="684" y="246" class="small">←     この候補をOFF</text><text x="684" y="279" class="small">Enter  選択 / 最終確認</text><text x="684" y="312" class="small">Esc    取り消し</text><g class="fade1"><circle cx="85" cy="375" r="13" fill="#3D69D5"/><text x="81" y="380" class="num">1</text><text x="104" y="380" class="label">候補へ移動</text></g><g class="fade2"><circle cx="342" cy="375" r="13" fill="#3D69D5"/><text x="338" y="380" class="num">2</text><text x="361" y="380" class="label">→でON</text></g><g class="fade3"><circle cx="604" cy="375" r="13" fill="#3D69D5"/><text x="600" y="380" class="num">3</text><text x="623" y="380" class="label">Enterで確定</text></g><rect x="47" y="111" width="945" height="223" rx="12" class="base" /><rect x="69" y="135" width="276" height="176" rx="12" class="hi ph1" /><text x="88" y="174" class="boxTitle">01  操作履歴</text><text x="88" y="213" class="small">編集するたびに記録</text><text x="88" y="257" class="small">2026-10 / 日時.diff</text><text x="88" y="289" class="hint">初期保持: 30日</text><rect x="379" y="135" width="276" height="176" rx="12" class="hi ph2" /><text x="398" y="174" class="boxTitle">02  保存履歴</text><text x="398" y="213" class="small">保存内容との差分</text><text x="398" y="257" class="small">2026-10 / 日時.diff</text><text x="398" y="289" class="hint">初期保持: 90日</text><rect x="687" y="135" width="276" height="176" rx="12" class="hi ph3" /><text x="706" y="174" class="boxTitle">03  Git履歴</text><text x="706" y="213" class="small">拡張からpush成功時</text><text x="706" y="257" class="small">2026-10 / 日時.diff</text><text x="706" y="289" class="hint">初期保持: 90日</text><path class="flow" d="M347 223 H375"/><path class="flow" d="M655 223 H684"/><g class="fade1"><circle cx="80" cy="366" r="13" fill="#3D69D5"/><text x="76" y="371" class="num">1</text><text x="99" y="371" class="label">操作ごと</text></g><g class="fade2"><circle cx="363" cy="366" r="13" fill="#3D69D5"/><text x="359" y="371" class="num">2</text><text x="382" y="371" class="label">保存時</text></g><g class="fade3"><circle cx="685" cy="366" r="13" fill="#3D69D5"/><text x="681" y="371" class="num">3</text><text x="704" y="371" class="label">Git push成功</text></g><rect x="48" y="111" width="477" height="229" rx="12" class="base" /><rect x="575" y="111" width="407" height="229" rx="12" class="base" /><text x="74" y="148" class="boxTitle">Coding Tools 設定</text><rect x="70" y="157" width="422" height="30" rx="6" class="base" /><text x="85" y="180" class="small">☑  操作履歴を記録</text><rect x="70" y="192" width="422" height="30" rx="6" class="hi ph2" /><text x="85" y="215" class="small">☑  保存履歴を記録</text><rect x="70" y="227" width="422" height="30" rx="6" class="base" /><text x="85" y="250" class="small">☑  Git履歴を記録</text><rect x="70" y="262" width="422" height="30" rx="6" class="base" /><text x="85" y="285" class="small">☑  最終確認を表示</text><text x="603" y="148" class="boxTitle">保存期間（各1〜360日）</text><rect x="603" y="174" width="353" height="37" rx="7" class="base" /><text x="623" y="199" class="small">操作履歴</text><text x="850" y="199" class="small">30 日</text><rect x="603" y="223" width="353" height="37" rx="7" class="base" /><text x="623" y="248" class="small">保存履歴</text><text x="850" y="248" class="small">90 日</text><rect x="603" y="272" width="353" height="37" rx="7" class="hi ph3" /><text x="623" y="297" class="small">Git履歴</text><text x="850" y="297" class="small">90 日</text><g class="fade1"><circle cx="80" cy="372" r="13" fill="#3D69D5"/><text x="76" y="377" class="num">1</text><text x="99" y="377" class="label">設定を開く</text></g><g class="fade2"><circle cx="345" cy="372" r="13" fill="#3D69D5"/><text x="341" y="377" class="num">2</text><text x="364" y="377" class="label">ON/OFF</text></g><g class="fade3"><circle cx="684" cy="372" r="13" fill="#3D69D5"/><text x="680" y="377" class="num">3</text><text x="703" y="377" class="label">1〜360日を選択</text></g><rect x="49" y="116" width="331" height="214" rx="12" class="base" /><rect x="447" y="116" width="532" height="214" rx="12" class="base" /><text x="75" y="157" class="boxTitle">ショートカット一覧</text><text x="80" y="209" class="code">Ctrl + K → Ctrl + S</text><text x="80" y="250" class="small">検索：Coding Tools</text><text x="472" y="156" class="boxTitle">コマンドを一覧から選択</text><rect x="465" y="171" width="491" height="37" rx="6" class="base" /><text x="478" y="197" class="small">次のクラスへ</text><text x="776" y="197" class="small">Ctrl+Alt+J</text><rect x="465" y="216" width="491" height="37" rx="6" class="base" /><text x="478" y="242" class="small">前のクラスへ</text><text x="776" y="242" class="small">Ctrl+Alt+K</text><rect x="465" y="261" width="491" height="37" rx="6" class="hi ph3" /><text x="478" y="287" class="small">貼り付け 2</text><text x="776" y="287" class="small">Ctrl+Alt+3</text><g class="fade1"><circle cx="83" cy="365" r="13" fill="#3D69D5"/><text x="79" y="370" class="num">1</text><text x="102" y="370" class="label">一覧を開く</text></g><g class="fade2"><circle cx="348" cy="365" r="13" fill="#3D69D5"/><text x="344" y="370" class="num">2</text><text x="367" y="370" class="label">名前で検索</text></g><g class="fade3"><circle cx="665" cy="365" r="13" fill="#3D69D5"/><text x="661" y="370" class="num">3</text><text x="684" y="370" class="label">キーを変更</text></g></svg>