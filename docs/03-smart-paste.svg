<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="ttl dsc">
<title id="ttl">03｜検索とCSSの貼り分け</title><desc id="dsc">専用の2枠貼り付けでCSSでは . を付ける。標準Ctrl+Vは変更しない。</desc><style>
svg { background:#F7F9FC; } text{font-family:"Yu Gothic","Noto Sans CJK JP",Meiryo,sans-serif;fill:#18253B}
.t{font-size:26px;font-weight:700}.hint{font-size:15px;fill:#64748b}.boxTitle{font-size:18px;font-weight:700}.code{font-size:20px;font-family:ui-monospace,Consolas,monospace}.small{font-size:15px}.label{font-size:15px;font-weight:700}.num{font-size:15px;font-weight:700;fill:#ffffff}
.flow{stroke:#4F79E9;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:7 8;animation:dash .95s linear infinite}
.hi{fill:#DEEAFF;stroke:#3D69D5;stroke-width:2}.base{fill:#fff;stroke:#CDD8EA;stroke-width:1.5}
.ph1{animation:p1 8s infinite}.ph2{animation:p2 8s infinite}.ph3{animation:p3 8s infinite}.ph4{animation:p4 8s infinite}
.fade1{animation:f1 8s infinite}.fade2{animation:f2 8s infinite}.fade3{animation:f3 8s infinite}.fade4{animation:f4 8s infinite}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes f1{0%,22%,100%{opacity:1}25%,97%{opacity:.16}}
@keyframes f2{0%,24%,100%{opacity:.15}27%,48%{opacity:1}51%,98%{opacity:.15}}
@keyframes f3{0%,49%,100%{opacity:.15}52%,73%{opacity:1}76%,98%{opacity:.15}}
@keyframes f4{0%,74%,100%{opacity:.15}78%,96%{opacity:1}98%{opacity:.15}}
@keyframes p1{0%,22%,100%{opacity:1}25%,97%{opacity:.2}}
@keyframes p2{0%,24%,100%{opacity:.2}27%,48%{opacity:1}51%,98%{opacity:.2}}
@keyframes p3{0%,49%,100%{opacity:.2}52%,73%{opacity:1}76%,98%{opacity:.2}}
@keyframes p4{0%,74%,100%{opacity:.2}78%,96%{opacity:1}98%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1040" height="400" fill="#F7F9FC"/><rect x="18" y="18" width="1004" height="364" rx="22" fill="#ffffff" stroke="#DFE7F2"/>
<text x="46" y="59" class="t">03｜検索とCSSの貼り分け</text><text x="46" y="86" class="hint">専用の2枠貼り付けでCSSでは . を付ける。標準Ctrl+Vは変更しない。</text><rect x="47" y="113" width="292" height="219" rx="12" class="base" /><rect x="400" y="113" width="258" height="219" rx="12" class="base" /><rect x="725" y="113" width="260" height="219" rx="12" class="base" /><text x="66" y="145" class="boxTitle">HTML / CSS</text><text x="74" y="184" class="code">class=&quot;card&quot;</text><text x="74" y="223" class="small">選択してコピー3</text><text x="432" y="145" class="boxTitle">独立した2枠</text><rect x="426" y="158" width="202" height="31" rx="7" class="base" /><text x="445" y="180" class="small">1  （保存済み）</text><rect x="426" y="195" width="202" height="31" rx="7" class="base" /><text x="445" y="217" class="small">2  （保存済み）</text><rect x="426" y="232" width="202" height="31" rx="7" class="hi ph3" /><text x="445" y="254" class="small">2  card</text><rect x="426" y="269" width="202" height="31" rx="7" class="base" /><text x="445" y="291" class="small">(旧枠は廃止)</text><text x="746" y="145" class="boxTitle">貼り付け先</text><text x="755" y="194" class="code">CSS: .card</text><text x="755" y="244" class="code">HTML: card</text><path d="M344 215 L393 215" class="flow"/><path d="M661 215 L718 215" class="flow"/><g class="fade1"><circle cx="80" cy="357" r="13" fill="#3D69D5"/><text x="76" y="362" class="num">1</text><text x="99" y="362" class="label">コピー 2</text></g><g class="fade2"><circle cx="347" cy="357" r="13" fill="#3D69D5"/><text x="343" y="362" class="num">2</text><text x="366" y="362" class="label">枠2に記憶</text></g><g class="fade3"><circle cx="603" cy="357" r="13" fill="#3D69D5"/><text x="599" y="362" class="num">3</text><text x="622" y="362" class="label">貼り付け 2</text></g><rect x="50" y="115" width="310" height="195" rx="12" class="base" /><rect x="410" y="115" width="195" height="195" rx="12" class="base" /><rect x="650" y="115" width="332" height="195" rx="12" class="base" /><text x="73" y="149" class="boxTitle">クラス名をコピー</text><text x="85" y="201" class="code">class=&quot;card&quot;</text><text x="435" y="149" class="boxTitle">内部の判定</text><text x="436" y="193" class="small">クラス名: card</text><text x="436" y="234" class="small">ドットを管理</text><text x="680" y="149" class="boxTitle">貼り付け先で分岐</text><rect x="679" y="163" width="276" height="56" rx="6" class="hi ph2" /><text x="696" y="197" class="small">CSSセレクタ → .card</text><rect x="679" y="235" width="276" height="56" rx="6" class="hi ph3" /><text x="696" y="269" class="small">検索 / HTML → card</text><path d="M363 215 L402 215" class="flow"/><path d="M610 215 L642 215" class="flow"/><g class="fade1"><circle cx="80" cy="357" r="13" fill="#3D69D5"/><text x="76" y="362" class="num">1</text><text x="99" y="362" class="label">専用コピー</text></g><g class="fade2"><circle cx="366" cy="357" r="13" fill="#3D69D5"/><text x="362" y="362" class="num">2</text><text x="385" y="362" class="label">専用貼付で「.」付き</text></g><g class="fade3"><circle cx="729" cy="357" r="13" fill="#3D69D5"/><text x="725" y="362" class="num">3</text><text x="748" y="362" class="label">通常検索は「.」なし</text></g></svg>