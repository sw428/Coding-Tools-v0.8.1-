<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-label="02｜コピー・貼り付けは2枠"><rect width="1080" height="470" rx="18" fill="#fff"/><rect x="10" y="10" width="1060" height="450" rx="18" fill="none" stroke="#d2dae8"/><style>
text{font-family:"Yu Gothic", "Noto Sans CJK JP", Arial,sans-serif;fill:#1c2d47} .head{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#5a687e}.box{fill:#f7faff;stroke:#c8d5e8;stroke-width:2}.hi{fill:#e7f1ff;stroke:#4079d5;stroke-width:2}.tag{fill:#2353a2}.tagtext{fill:#fff;font-weight:700;font-size:17px}.code{font-family:Consolas,monospace;font-size:18px}.label{font-size:20px;font-weight:700}.note{font-size:15px;fill:#56657a}.arrow{fill:none;stroke:#4778c8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 9;animation:move 1.5s linear infinite}.pulse{animation:pulse 4.2s ease-in-out infinite}.step2{animation:fade2 4.2s ease-in-out infinite}.step3{animation:fade3 4.2s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-44}}@keyframes pulse{0%,26%,100%{opacity:.4}10%,23%{opacity:1}}@keyframes fade2{0%,26%,55%,100%{opacity:.5}33%,52%{opacity:1}}@keyframes fade3{0%,56%,100%{opacity:.5}66%,94%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse,.step2,.step3,.arrow{animation:none!important;opacity:1!important}}</style><text x="44" y="57" class="head">02｜コピー・貼り付けは2枠</text><text x="44" y="88" class="sub">コピー1・2と貼り付け1・2。スニペットは別に保存して使えます。</text><g class="pulse"><rect class="box" x="42" y="145" width="255" height="218" rx="13"/><text class="label" x="67" y="181">コピー元</text><text class="code" x="67" y="240">.card { ... }</text><text class="note" x="67" y="314">コピー 1 / コピー 2</text></g>
<path class="arrow" d="M309 245 H370"/><g class="step2"><rect class="hi" x="381" y="145" width="290" height="218" rx="13"/><text class="label" x="404" y="179">独立した2つの保存枠</text><rect x="404" y="199" width="243" height="49" rx="8" fill="#dbeafe"/><text class="code" x="423" y="229">1  .card { ... }</text><rect x="404" y="264" width="243" height="49" rx="8" fill="#eef2f9"/><text class="code" x="423" y="294">2  保存済みコード</text><text class="note" x="405" y="347">枠ごとの内容は独立</text></g>
<path class="arrow" d="M681 245 H744"/><g class="step3"><rect class="box" x="758" y="145" width="276" height="218" rx="13"/><text class="label" x="778" y="182">貼り付け先</text><text class="code" x="778" y="239">.card { ... }</text><text class="note" x="779" y="316">貼り付け 1 / 2</text></g><text x="44" y="438" class="note">通常の Ctrl+C / Ctrl+V は変更しません。選択や編集が必要な処理は専用コマンドです。</text></svg>